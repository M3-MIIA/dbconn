[project]
name = "miia-dbconn"
version = "0.1.0"
description = "Um pacote para gerenciar conexões de banco de dados"
readme = "README.md"
authors = [
    { name = "M3-MIIA", email = "ari.oliveira@protonmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "SQLAlchemy>=2.0.41,<2.1",
    "psycopg[binary]>=3.2.9,<3.3"
]

# Dependencies needed at runtime, but that are provided by the default AWS
# lambda Python runtime or other lambda layers:
[project.optional-dependencies]
full = [
    "boto3>=1.39.3,<1.40"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dbconn"]